# Bouwt de pdf van het boek uit de gegevens in deze repo en zet hem in Cloudflare R2
# (bucket "files"), zodat hij te downloaden is op https://dl.fldr.nl/kookboek/uit-de-pluktuin-2026.pdf
#
# Draait bij elke push naar main die recepten, foto's of de boekopmaak verandert, en met de hand
# via "Run workflow". Nodig als repository-secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID en
# R2_SECRET_ACCESS_KEY (R2-token met Object Read & Write op alleen deze bucket).
#
# De foto's komen uit public/fotos (1600 px breed); dat is ruim genoeg voor A4 op 150 dpi.
name: Pdf naar R2

on:
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'public/fotos/**'
      - 'boek/**'
      - '.github/workflows/pdf-naar-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-naar-r2
  cancel-in-progress: true

env:
  BUCKET: files
  SLEUTEL: kookboek/uit-de-pluktuin-2026.pdf
  URL: https://dl.fldr.nl/kookboek/uit-de-pluktuin-2026.pdf

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Pillow en Playwright installeren
        run: |
          pip install pillow playwright
          python -m playwright install --with-deps chromium

      - name: Drukfoto's maken uit de webfoto's
        run: |
          python - public/fotos fotos <<'PY'
          import os, sys
          from PIL import Image
          src, uit = sys.argv[1], sys.argv[2]
          os.makedirs(uit, exist_ok=True)
          for f in os.listdir(src):
              if f.endswith('-1600.webp'):
                  Image.open(os.path.join(src, f)).convert('RGB').save(os.path.join(uit, f[:-10] + '.jpeg'), quality=92)
          PY
          python boek/drukfotos.py fotos drukfotos

      - name: Boek bouwen
        run: |
          python boek/bouw.py drukfotos boek.pdf --schrijf | tee bouw.log
          if ! git diff --quiet -- src/data; then
            echo "::warning::De paginanummers in src/data kloppen niet meer met de pdf. Bouw het boek lokaal met --schrijf en push de nieuwe nummers."
          fi
          head -c 5 boek.pdf | grep -q '%PDF-'
          ls -l boek.pdf

      - name: Uploaden naar R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp boek.pdf "s3://$BUCKET/$SLEUTEL" --endpoint-url "$ENDPOINT" \
            --content-type application/pdf \
            --content-disposition 'attachment; filename="Uit de pluktuin 2026.pdf"' \
            --cache-control 'public, max-age=300'

      - name: Controleren of hij online staat
        run: |
          verwacht=$(stat -c %s boek.pdf)
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o online.pdf -w '%{http_code}' "$URL?controle=$GITHUB_RUN_ID-$i")
            if [ "$code" = 200 ] && [ "$(stat -c %s online.pdf)" = "$verwacht" ]; then
              echo "Online: $URL ($verwacht bytes)"; exit 0
            fi
            echo "Poging $i: status $code"; sleep 10
          done
          exit 1
